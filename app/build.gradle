plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.namaz.reminder'
    compileSdk 34
    signingConfigs {
        debug {
            storeFile file("debug-key.p12")
            storeType "PKCS12"
            storePassword "namazdebug123"
            keyAlias "namazdebugkey"
            keyPassword "namazdebug123"
        }
    }
    defaultConfig {
        applicationId "com.namaz.reminder"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
