name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Namaz Reminder Pro (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Write build status file
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then S="success"; else S="failed"; fi
          printf '{\n  "status": "%s",\n  "run_number": "%s",\n  "apk_url": "https://github.com/%s/releases/download/build-%s/app-debug.apk",\n  "run_url": "https://github.com/%s/actions/runs/%s"\n}\n' \
            "$S" "${{ github.run_number }}" "${{ github.repository }}" \
            "${{ github.run_number }}" "${{ github.repository }}" "${{ github.run_id }}" \
            > last-build.json
          git config user.name "muse-builder"
          git config user.email "muse-builder@localhost"
          git add last-build.json
          git commit -m "build ${{ github.run_number }}: $S [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
